<!-- Recap (AUX): the event photo full bleed, a thank-you headline, an optional quote. Ported from the prototype's
     templates/recap.js. -->
<template data-template="recap" data-slide data-group="Event" data-label="Recap"
          data-description="After the event: photo and thanks, or a quote"
          data-sizes="ig-post" data-supports="ig-post ig-square ig-story linkedin meetup">
  <script type="application/json">
  {
    "uses": ["event"],
    "fields": [
      { "key": "photo",   "label": "Event photo", "type": "image" },
      { "key": "title",   "label": "Headline", "default": "Díky za *UXMonday*!" },
      { "key": "text",    "label": "Text", "type": "long" },
      { "key": "quote",   "label": "Quote (optional)", "type": "long" },
      { "key": "quoteBy", "label": "Quote author" }
    ],
    "parts": [
      { "key": "graphic", "label": "Graphic", "choices": "graphic", "fit": true },
      { "key": "texture", "label": "Texture", "choices": "texture", "scope": "design" }
    ]
  }
  </script>

  <section class="board aux-p" data-v="spread" data-aux-backdrop="photo" data-aux-photo="own" data-choices-graphic="photo photo-cut@story photo-cut@landscape photo-chevron@landscape photo-rotated@landscape">
    <figure class="media aux-cover" data-p="photo"></figure>
      <div class="aux-lockup">
        <div class="logo" data-variant="auto"></div>
        <span class="aux-lockup__sep"></span>
        <span class="aux-lockup__series" data-f="event.series"></span>
      </div>
    <div class="stack aux-bottom">
      <p class="aux-quote aux-quote--big" data-f="quote" data-if="quote"></p>
      <p class="aux-role" data-f="quoteBy" data-if="quote"></p>
      <h1 data-aux-fit data-steps="h1 h2 h3" data-f="title"></h1>
      <p class="aux-desc" data-f="text" data-if="text" data-drop="1"></p>
      <div class="aux-chips" data-group>
        <span class="aux-chip" data-hl data-group>
          <span data-show="event.date" data-format="date"></span>
          <span data-f="event.time"></span>
        </span>
        <span class="aux-chip" data-show="event.venue event.city" data-join=", "></span>
      </div>
    </div>
  </section>
</template>
