<!-- Quote (AUX): the quote, the name and role, a portrait. Own fields; may be a page of any carousel. -->
<template data-template="quote" data-slide data-group="Posts" data-label="Quote"
          data-description="A quote with who said it, and an optional portrait"
          data-sizes="ig-post" data-supports="ig-post ig-square ig-story linkedin meetup">
  <script type="application/json">
  {
    "preview": {"kicker": "UXMonday", "headline": "Dobrý design je ten, který *nikdo neřeší*.", "name": "Jana Nováková", "role": "Lead Product Designer"},
    "fields": [
      {"key": "kicker", "label": "Kicker or series", "default": "Novinka"},
      {"key": "headline", "label": "Quote"},
      {"key": "name", "label": "Name"},
      {"key": "role", "label": "Role"},
      {"key": "portrait", "label": "Portrait", "type": "image"},
      {"key": "image", "label": "Photo", "type": "image"}
    ],
    "parts": [
      { "key": "logo",    "label": "Logo" },
      { "key": "graphic", "label": "Graphic", "choices": "graphic", "fit": true },
      { "key": "texture", "label": "Texture", "choices": "texture", "scope": "design" }
    ]
  }
  </script>

  <section class="board aux-p" data-v="spread" data-aux-backdrop="rotated corner lines" data-aux-anchor="bottom" data-choices-graphic="chevron-low corner lines plain photo-chevron photo chevron-high@ig-square chevron-high@story chevron-high@landscape cross@story cross@landscape rotated@story rotated@landscape photo-cut@story photo-cut@landscape photo-rotated@story photo-rotated@landscape">
    <figure class="media aux-cover" data-p="image"></figure>
    <div class="aux-pill" data-show="/pageNo" data-format="pager"></div>
    <div class="logo" data-variant="auto" data-part="logo"></div>
    <div class="stack aux-bottom">
      <p class="eyebrow" data-f="/kicker"></p>
      <h1 class="aux-h-sm" data-aux-fit data-steps="h2 h3" data-f="headline"></h1>
      <div class="aux-person aux-person--quote">
        <span class="avatar" data-p="portrait" data-initials="name"></span>
        <div class="aux-person__txt">
          <p class="aux-person__name" data-f="name"></p>
          <p class="aux-person__role" data-f="role"></p>
        </div>
      </div>
    </div>
  </section>

</template>
