<!-- Number (AUX): a big number and what it counts, or a headline with up to three figures in a row. Own fields; may be a page of any carousel. -->
<template data-template="number" data-slide data-group="Posts" data-label="Number"
          data-description="A big number with a line under it, or a row of numbers"
          data-sizes="ig-post" data-supports="ig-post ig-square ig-story linkedin meetup">
  <script type="application/json">
  {
    "preview": {"kicker": "UXMonday", "stat": "3×", "headline": "rychleji k *prvnímu prototypu*", "text": "Když tým sdílí jednu knihovnu komponent."},
    "fields": [
      {"key": "kicker", "label": "Kicker or series", "default": "Novinka"},
      {"key": "stat", "label": "Number"},
      {"key": "headline", "label": "Headline"},
      {"key": "text", "label": "Text", "type": "long"},
      {"key": "n1", "label": "Number 1"},
      {"key": "n2", "label": "Number 2"},
      {"key": "n3", "label": "Number 3"},
      {"key": "image", "label": "Photo", "type": "image"}
    ],
    "parts": [
      { "key": "logo",    "label": "Logo" },
      { "key": "graphic", "label": "Graphic", "choices": "graphic", "fit": true },
      { "key": "texture", "label": "Texture", "choices": "texture", "scope": "design" }
    ]
  }
  </script>

  <section class="board aux-p" data-layout="big" data-label="Big number" data-v="spread" data-aux-backdrop="chevron-high cross lines" data-choices-graphic="corner lines plain photo chevron-high@story chevron-low@landscape chevron-high@landscape cross@landscape rotated@landscape photo-cut@landscape photo-chevron@landscape photo-rotated@landscape">
    <figure class="media aux-cover" data-p="image"></figure>
    <div class="aux-pill" data-show="/pageNo" data-format="pager"></div>
    <p class="eyebrow" data-f="/kicker"></p>
    <div class="stack aux-bottom">
      <p class="aux-bignum" data-aux-fit data-f="stat"></p>
      <h1 class="aux-h-sm" data-aux-fit data-steps="h2 h3" data-f="headline"></h1>
      <p class="aux-role" data-f="text" data-drop="1"></p>
    </div>
  </section>

  <section class="board aux-p" data-layout="row" data-label="Row of numbers" data-v="spread" data-aux-backdrop="lines plain" data-choices-graphic="lines plain photo chevron-low@landscape chevron-high@landscape cross@landscape rotated@landscape corner@landscape photo-cut@landscape photo-chevron@landscape photo-rotated@landscape">
    <figure class="media aux-cover" data-p="image"></figure>
    <div class="aux-pill" data-show="/pageNo" data-format="pager"></div>
    <p class="eyebrow" data-f="/kicker"></p>
    <div class="stack aux-bottom">
      <h1 class="aux-h-sm" data-aux-fit data-steps="h2 h3" data-f="headline"></h1>
      <p class="aux-desc" data-f="text" data-drop="1"></p>
      <div class="aux-stats" data-group>
        <span class="aux-stat" data-f="n1"></span><span class="aux-stat" data-f="n2"></span><span class="aux-stat" data-f="n3"></span>
      </div>
    </div>
  </section>

</template>
