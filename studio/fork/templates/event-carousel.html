<!-- Event carousel (AUX): cover, a page per speaker of the shared event, the agenda, a closing page. Ported from the
     prototype's templates/carousel.js. The speaker pages are the spotlight pages on the mint ground; the agenda page is
     left out when the event has no agenda. Exports PNG pages and one PDF. -->
<template data-template="event-carousel" data-slide data-group="Event" data-label="Event carousel"
          data-description="Cover, speakers, agenda and a closing page; Instagram slides and a LinkedIn PDF"
          data-sizes="ig-post" data-supports="ig-post ig-square ig-story" data-pages="event.speakers">
  <script type="application/json">
  {
    "uses": ["event"],
    "fields": [
      { "key": "cover", "label": "Cover page photo", "type": "image" },
      { "key": "closingPhoto", "label": "Closing page photo", "type": "image" },
      { "key": "closing", "label": "Last page headline", "default": "Uvidíme se na *UXMonday*?" }
    ],
    "parts": [
      { "key": "graphic", "label": "Graphic", "choices": "graphic", "fit": true },
      { "key": "texture", "label": "Texture", "choices": "texture", "scope": "design" }
    ]
  }
  </script>

  <section class="board aux-p" data-page="first" data-label="Cover" data-v="spread" data-aux-backdrop="rotated corner lines" data-choices-graphic="chevron-low rotated corner lines plain photo-cut photo-chevron photo-rotated photo chevron-high@ig-post chevron-high@story chevron-high@landscape cross@story cross@landscape">
    <figure class="media aux-cover" data-p="cover"></figure>
    <div class="aux-pill"><span data-show="/pageNo" data-format="int"></span>/<span data-show="/pageCount"></span></div>
    <div class="stack aux-top">
      <div class="aux-lockup">
        <div class="logo" data-variant="auto"></div>
        <span class="aux-lockup__sep"></span>
        <span class="aux-lockup__series" data-f="event.series"></span>
      </div>
      <div class="aux-chips" data-group>
        <span class="aux-chip" data-hl data-group>
          <span data-show="event.date" data-format="date"></span>
          <span data-f="event.time"></span>
        </span>
        <span class="aux-chip" data-show="event.venue event.city" data-join=", "></span>
      </div>
      <h1 data-aux-fit data-steps="h1 h2 h3" data-f="event.title"></h1>
    </div>
    <p class="aux-swipe">Listuj →</p>
  </section>

  <section class="board aux-p" data-ground="mint" data-v="spread" data-aux-backdrop="photo-cut photo" data-aux-photo="own" data-choices-graphic="photo photo-cut@ig-post photo-cut@story photo-cut@landscape photo-chevron@landscape photo-rotated@landscape">
    <figure class="media aux-cover" data-p="photo"></figure>
    <div class="aux-pill"><span data-show="/pageNo" data-format="int"></span>/<span data-show="/pageCount"></span></div>
    <div class="aux-lockup aux-lockup--mark">
      <div class="logo" data-variant="auto"></div>
    </div>
    <div class="stack aux-bottom">
      <p class="eyebrow"><span data-show="/event.series" data-format="speaks"></span></p>
      <h1 data-aux-fit data-steps="h1 h2" data-f="name"></h1>
      <p class="aux-role" data-show="role company" data-join=", " data-drop="3"></p>
      <p class="aux-quote" data-part="talk" data-f="/event.title"></p>
      <div class="aux-chips" data-group>
        <span class="aux-chip" data-hl data-group>
          <span data-show="/event.date" data-format="date"></span>
          <span data-f="/event.time"></span>
        </span>
        <span class="aux-chip" data-part="place" data-show="/event.venue /event.city" data-join=", "></span>
      </div>
    </div>
  </section>

  <section class="board aux-p" data-page="last" data-label="Agenda" data-if="event.agenda" data-ground="mint" data-v="spread" data-aux-backdrop="plain" data-choices-graphic="lines plain corner@ig-square">
    <div class="aux-pill"><span data-show="/pageNo" data-format="int"></span>/<span data-show="/pageCount"></span></div>
    <div class="stack aux-top">
      <div class="aux-lockup">
        <div class="logo" data-variant="auto"></div>
        <span class="aux-lockup__sep"></span>
        <span class="aux-lockup__series" data-f="event.series"></span>
      </div>
      <p class="eyebrow">Program</p>
      <h1 data-aux-fit data-steps="h2 h3" class="h2" data-f="event.title"></h1>
      <div class="aux-agenda">
        <div class="aux-ag" data-each="event.agenda"><b data-f="time"></b><span data-f="label"></span></div>
      </div>
    </div>
    <div class="aux-chips" data-group>
      <span class="aux-chip" data-hl data-group>
        <span data-show="event.date" data-format="date"></span>
        <span data-f="event.time"></span>
      </span>
      <span class="aux-chip" data-show="event.venue event.city" data-join=", "></span>
    </div>
  </section>

  <section class="board aux-p" data-page="last" data-label="Closing" data-v="spread" data-aux-backdrop="chevron-low corner lines" data-aux-anchor="bottom" data-choices-graphic="chevron-low corner lines plain photo-cut photo-chevron photo chevron-high@ig-post chevron-high@story chevron-high@landscape rotated@ig-post rotated@story rotated@landscape photo-rotated@ig-post photo-rotated@story photo-rotated@landscape cross@story cross@landscape">
    <figure class="media aux-cover" data-p="closingPhoto"></figure>
    <div class="aux-pill"><span data-show="/pageNo" data-format="int"></span>/<span data-show="/pageCount"></span></div>
    <div class="stack aux-top">
      <div class="aux-lockup">
        <div class="logo" data-variant="auto"></div>
        <span class="aux-lockup__sep"></span>
        <span class="aux-lockup__series" data-f="event.series"></span>
      </div>
      <div class="aux-chips" data-group>
        <span class="aux-chip" data-hl data-group>
          <span data-show="event.date" data-format="date"></span>
          <span data-f="event.time"></span>
        </span>
        <span class="aux-chip" data-show="event.venue event.city" data-join=", "></span>
      </div>
      <h1 data-aux-fit data-steps="h1 h2 h3" data-f="/closing"></h1>
      <p class="aux-cta" data-f="event.cta"></p>
    </div>
  </section>
</template>
